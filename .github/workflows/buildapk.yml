name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: buildapk-${{ github.ref }}
  cancel-in-progress: true

env:
  RAYLIB_VERSION: "5.5"
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  GRADLE_VERSION: "8.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Исходники raylib в репозиторий класть не нужно - скачиваются при сборке
      - name: Download raylib ${{ env.RAYLIB_VERSION }}
        run: git clone --depth 1 --branch "$RAYLIB_VERSION" https://github.com/raysan5/raylib.git app/src/main/cpp/raylib

      - name: Install SDK platform, NDK and CMake
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Collect APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GRIT3.5-GLOBAL-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/GRIT3.5-GLOBAL.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRIT3.5-GLOBAL-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # Публикация в Releases при создании тега:  git tag v3.1 && git push --tags
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: GRIT3.5-GLOBAL-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GRIT3.5-GLOBAL.apk
            GRIT3.5-GLOBAL-${{ needs.build.outputs.version }}.apk
