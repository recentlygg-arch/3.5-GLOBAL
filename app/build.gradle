plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sandstrike.game'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.sandstrike.game'
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName '3.5-GLOBAL'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
